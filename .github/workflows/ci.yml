name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build and test release DMG
        run: bash scripts/build-dmg.sh

      - name: Validate property list
        run: plutil -lint Info.plist

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: slskdbar-dmg
          path: dist/*.dmg
