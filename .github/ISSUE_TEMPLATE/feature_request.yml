name: Feature request
description: Suggest a focused improvement to Slskd Menu
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: resource_use
    attributes:
      label: Background activity
      description: Explain whether the feature needs polling, a persistent connection, or no background work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
